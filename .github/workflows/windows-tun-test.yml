name: Windows TUN 自动测试

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-tun-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-tun:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 检查 Windows 环境与管理员权限
        shell: pwsh
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = New-Object Security.Principal.WindowsPrincipal($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw '需要管理员权限' }

      - name: 下载最新 sing-box 与 Wintun
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Accept = 'application/vnd.github+json'; Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'sbtun-tun-test' }
          $release = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/SagerNet/sing-box/releases/latest'
          $asset = $release.assets | Where-Object { $_.name -match 'windows-amd64\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw '未找到 sing-box Windows 资产' }
          $zip = "$env:RUNNER_TEMP\sing-box.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\sing-box" -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP\sing-box" -Filter sing-box.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw '未找到 sing-box.exe' }
          $wintunPage = Invoke-WebRequest -Uri 'https://www.wintun.net/'
          $wintunMatch = [regex]::Match($wintunPage.Content, 'builds/wintun-(?<version>[0-9.]+)\.zip')
          if (-not $wintunMatch.Success) { throw 'Wintun 官网没有找到最新构建包' }
          $wintunVersion = $wintunMatch.Groups['version'].Value
          $wintunZip = "$env:RUNNER_TEMP\wintun.zip"
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-$wintunVersion.zip" -OutFile $wintunZip
          Expand-Archive -Path $wintunZip -DestinationPath "$env:RUNNER_TEMP\wintun" -Force
          $wintunDll = Get-ChildItem "$env:RUNNER_TEMP\wintun" -Filter wintun.dll -Recurse | Where-Object { $_.FullName -match '\\amd64\\' } | Select-Object -First 1
          if (-not $wintunDll) { throw '未找到 Wintun amd64 DLL' }
          Copy-Item $wintunDll.FullName (Join-Path $exe.DirectoryName 'wintun.dll') -Force
          "SINGBOX=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8
          "WINTUN_VERSION=$wintunVersion" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $dllInfo = Get-Item (Join-Path $exe.DirectoryName 'wintun.dll')
          Write-Host "wintun.dll: $($dllInfo.FullName) ($($dllInfo.Length) bytes, 来自 $($wintunDll.FullName))"
          & $exe.FullName version

      # 注意：Windows runner 会在每个 step 结束时结束该 step 启动的进程树，
      # 所以启动 sing-box 和检测 TUN 必须放在同一个 step 里（见脚本说明）。
      - name: 启动并检测真实 TUN 后端
        shell: pwsh
        run: ./.github/scripts/windows-tun-test.ps1 -SingBox $env:SINGBOX -WorkDir "$env:RUNNER_TEMP\sbtun-tun-test"

      - name: 清理残留进程
        if: always()
        shell: pwsh
        run: |
          Get-Process -Name sing-box -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host 'Windows TUN 自动测试结束。'
